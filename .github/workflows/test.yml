name: Test Sparse Updater

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sparse updater files
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            tests
            state
            SH6
          sparse-checkout-cone-mode: true

      - name: Verify sparse working tree
        run: |
          test ! -e CQWW
          test ! -e RECONSTRUCTED_LOGS
          test -f scripts/archive_updater.py
          test -f state/schema.json
          test -f SH6/logs_00.sqlite
          test -n "$(git ls-tree -r --name-only HEAD -- CQWW | sed -n '1p')"

      - name: Compile scripts
        run: python3 -m compileall -q scripts

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Audit Git tree against SH6
        run: python3 scripts/shard_index.py audit
